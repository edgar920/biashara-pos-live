<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>Biashara Sales</title>
<style>
:root{--ink:#17213a;--muted:#76839a;--bg:#f4f6fb;--white:#fff;--line:#e8ecf4;--blue:#4f46e5;--purple:#7c3aed;--mint:#0eae79;--orange:#f59e0b;--danger:#ef476f;--shadow:0 12px 32px rgba(35,47,78,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.phone{width:min(100%,430px);min-height:100vh;margin:auto;background:var(--bg);padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom));position:relative}.top{padding:20px 20px 14px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 10px 26px #5148d936}.toprow{display:flex;justify-content:space-between;align-items:center}.avatar{width:37px;height:37px;border-radius:13px;background:#ffffff20;display:grid;place-items:center;font-weight:900}.top h1{font-size:20px;margin:18px 0 4px;letter-spacing:-.5px}.top p{margin:0;color:#dedbff;font-size:13px}.today{font-size:12px;background:#ffffff20;padding:7px 10px;border-radius:9px}.sale-card{margin:16px 20px 0;background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow)}.sale-card small,.section-title small{color:var(--muted)}.sale-number{font-size:30px;letter-spacing:-1px;font-weight:850;margin:4px 0 15px}.sale-row{display:flex;gap:10px}.sale-stat{flex:1;background:#f6f7fe;border-radius:12px;padding:10px}.sale-stat b{display:block;margin-top:4px;font-size:15px}.content{padding:20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:4px 0 12px}.section-title h2{margin:0;font-size:16px}.search{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 12px;margin-bottom:13px}.search input{border:0;outline:0;padding:13px 8px;width:100%;font:inherit;background:transparent}.products{display:grid;grid-template-columns:1fr 1fr;gap:11px}.product{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;text-align:left;cursor:pointer;box-shadow:0 5px 12px rgba(48,57,82,.04);transition:.18s}.product:active{transform:scale(.97)}.product-art{height:56px;border-radius:12px;display:grid;place-items:center;font-size:28px;margin-bottom:10px}.art1{background:#e7f8f0}.art2{background:#e9eeff}.art3{background:#fff2df}.art4{background:#f8eafa}.product b{display:block;font-size:14px}.product small{display:block;color:var(--muted);font-size:12px;margin:4px 0 8px}.price{color:var(--blue);font-weight:800}.low{color:#cf7d00!important;font-weight:800}.cart-fab{position:fixed;z-index:2;bottom:78px;left:50%;transform:translateX(-50%);width:min(calc(100% - 40px),390px);background:#17213a;color:#fff;border:0;border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font:inherit;font-weight:800;box-shadow:0 14px 30px #17213a55;cursor:pointer}.cart-badge{background:#fff;color:#17213a;border-radius:8px;padding:4px 7px;font-size:12px}.nav{position:fixed;z-index:3;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,430px);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:var(--muted);font:12px inherit;padding:4px;cursor:pointer}.nav span{display:block;font-size:20px;margin-bottom:3px}.nav button.active{color:var(--blue);font-weight:800}.sheet{display:none;position:fixed;inset:0;z-index:5;background:#17213a55;align-items:end}.sheet.open{display:flex}.sheet-card{width:min(100%,430px);margin:auto;background:#fff;border-radius:25px 25px 0 0;max-height:82vh;padding:14px 20px 28px;overflow:auto}.grab{width:42px;height:4px;background:#d5d9e4;border-radius:5px;margin:0 auto 17px}.sheet-head{display:flex;justify-content:space-between;align-items:center}.sheet-head h2{margin:0;font-size:19px}.close{background:#f1f3f8;border:0;border-radius:10px;width:33px;height:33px;font-size:20px;cursor:pointer}.cart-line{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.cart-line small{display:block;color:var(--muted);margin-top:3px}.step{display:flex;align-items:center;gap:7px;background:#f3f5fa;border-radius:10px;padding:4px}.step button{width:26px;height:26px;border:0;border-radius:7px;background:#fff;font-size:16px;cursor:pointer}.total{display:flex;justify-content:space-between;align-items:end;padding:17px 0}.total small{color:var(--muted);display:block}.total b{font-size:25px;letter-spacing:-.6px}.checkout{width:100%;border:0;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-radius:14px;padding:15px;font:inherit;font-weight:800;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:35px 0}.settings{display:none}.settings.open{display:block}.form-card{background:#fff;border-radius:16px;padding:14px;margin-top:12px}.field{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;margin:6px 0;font:inherit}.save{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px;width:100%;font:inherit;font-weight:800;margin-top:6px}.receipt{display:none;background:#fff;color:#111;padding:8mm;width:78mm;margin:auto;font:12px Arial}.receipt h2,.receipt p{text-align:center;margin:0 0 4px}.receipt hr{border:0;border-top:1px dashed #666;margin:10px 0}.receipt-line{display:flex;justify-content:space-between;margin:5px 0}.receipt-total{font-size:15px;font-weight:bold;margin-top:10px}@media print{.phone,.sheet{display:none!important}.receipt{display:block!important;width:80mm;margin:0;padding:5mm}}
</style>
</head>
<body>
<main class="phone"><header class="top"><div class="toprow"><div class="avatar">B</div><span class="today" id="today"></span></div><h1 id="businessTitle">My Business</h1><p>Good to see you. Let’s make a sale.</p></header>
<section class="sale-card"><small>Today’s sales</small><div class="sale-number" id="salesTotal">UGX 0</div><div class="sale-row"><div class="sale-stat"><small>Orders</small><b id="orders">0</b></div><div class="sale-stat"><small>Stock items</small><b id="stockTotal">0</b></div><div class="sale-stat"><small>In cart</small><b id="cartItems">0</b></div></div></section>
<section class="content" id="home"><div class="section-title"><h2>Quick sale</h2><small id="productCount"></small></div><div class="search">⌕<input id="search" placeholder="Search products"></div><div class="products" id="products"></div></section>
<section class="content settings" id="settings"><div class="section-title"><h2>Business profile</h2><small>Shows on receipts</small></div><div class="form-card"><form id="businessForm"><input class="field" id="businessName" placeholder="Business name" required><input class="field" id="businessPhone" placeholder="Phone number"><input class="field" id="businessAddress" placeholder="Address or location"><button class="save">Save business details</button></form></div><div class="section-title" style="margin-top:24px"><h2>Inventory</h2><small>Add a product</small></div><div class="form-card"><form id="productForm"><input class="field" id="name" placeholder="Product name" required><input class="field" id="price" type="number" min="1" placeholder="Price (UGX)" required><input class="field" id="stock" type="number" min="0" placeholder="Stock quantity" required><button class="save">Add product</button></form></div></section>
<button class="cart-fab" id="openCart"><span>🛒 <span id="cartLabel">Your sale</span></span><span class="cart-badge" id="cartTotal">UGX 0</span></button>
<nav class="nav"><button class="active" data-tab="home"><span>⌂</span>Sales</button><button data-tab="sales"><span>▣</span>Orders</button><button data-tab="settings"><span>⚙</span>More</button><button id="openProfile"><span>◉</span>Profile</button></nav></main>
<section class="sheet" id="sheet"><div class="sheet-card"><div class="grab"></div><div class="sheet-head"><h2>Current sale</h2><button class="close" id="closeCart">×</button></div><div id="cart"></div><div class="total"><div><small>Total to pay</small><b id="total">UGX 0</b></div><small id="itemCount">0 items</small></div><button class="checkout" id="pay">Complete sale &amp; print receipt</button></div></section>
<section class="receipt" id="receipt"></section>
<script>
const q=id=>document.getElementById(id),K='biashara_sales_mobile',cash=n=>'UGX '+Number(n).toLocaleString();
let s=JSON.parse(localStorage.getItem(K)||'null')||{p:[{id:1,n:'Soda',v:2000,k:24,a:'🥤',c:'art1'},{id:2,n:'Water',v:1000,k:30,a:'💧',c:'art2'},{id:3,n:'Bread',v:3500,k:12,a:'🍞',c:'art3'},{id:4,n:'Sugar 1kg',v:6000,k:8,a:'🛍️',c:'art4'}],c:[],z:[],b:{name:'My Business',phone:'',address:''}};s.b=s.b||{name:'My Business',phone:'',address:''};s.c=s.c||[];s.z=s.z||[];
function save(){localStorage.setItem(K,JSON.stringify(s))}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){let stock=s.p.reduce((a,x)=>a+x.k,0),sum=s.c.reduce((a,x)=>a+x.v*x.q,0),rev=s.z.reduce((a,x)=>a+x.t,0),pieces=s.c.reduce((a,x)=>a+x.q,0),needle=q('search').value.toLowerCase();q('businessTitle').textContent=s.b.name||'My Business';q('salesTotal').textContent=cash(rev);q('orders').textContent=s.z.length;q('stockTotal').textContent=stock;q('cartItems').textContent=pieces;q('productCount').textContent=s.p.length+' items';q('cartTotal').textContent=cash(sum);q('cartLabel').textContent=pieces?'Your sale · '+pieces+' item'+(pieces>1?'s':''):'Your sale';q('total').textContent=cash(sum);q('itemCount').textContent=pieces+' item'+(pieces===1?'':'s');let list=s.p.filter(x=>x.n.toLowerCase().includes(needle));q('products').innerHTML=list.map(x=>'<button class="product" onclick="add('+x.id+')"><div class="product-art '+x.c+'">'+x.a+'</div><b>'+esc(x.n)+'</b><small class="'+(x.k<5?'low':'')+'">'+x.k+' in stock</small><span class="price">'+cash(x.v)+'</span></button>').join('')||'<div class="empty">No products found.</div>';q('cart').innerHTML=s.c.map(x=>'<div class="cart-line"><div><b>'+esc(x.n)+'</b><small>'+cash(x.v)+' each</small></div><div class="step"><button onclick="chg('+x.id+',-1)">−</button><b>'+x.q+'</b><button onclick="chg('+x.id+',1)">+</button></div><b>'+cash(x.v*x.q)+'</b></div>').join('')||'<div class="empty">No items yet.<br><small>Tap a product to add it.</small></div>'}
window.add=id=>{let p=s.p.find(x=>x.id===id),c=s.c.find(x=>x.id===id);if(!p||!p.k)return;if(c&&c.q<p.k)c.q++;else if(!c)s.c.push({id:p.id,n:p.n,v:p.v,q:1});save();draw()};window.chg=(id,n)=>{let c=s.c.find(x=>x.id===id);c.q+=n;if(c.q<1)s.c=s.c.filter(x=>x.id!==id);save();draw()};
function receipt(r){let b=s.b;q('receipt').innerHTML='<h2>'+esc(b.name||'My Business')+'</h2>'+(b.phone?'<p>'+esc(b.phone)+'</p>':'')+(b.address?'<p>'+esc(b.address)+'</p>':'')+'<p>Sales receipt</p><p>'+r.d+'</p><hr>'+r.lines.map(x=>'<div class="receipt-line"><span>'+esc(x.n)+' × '+x.q+'</span><span>'+cash(x.v*x.q)+'</span></div>').join('')+'<hr><div class="receipt-line receipt-total"><span>TOTAL</span><span>'+cash(r.t)+'</span></div><p style="margin-top:14px">Thank you for your business</p>'}
q('openCart').onclick=()=>q('sheet').classList.add('open');q('closeCart').onclick=()=>q('sheet').classList.remove('open');q('sheet').onclick=e=>{if(e.target===q('sheet'))q('sheet').classList.remove('open')};q('search').oninput=draw;q('openProfile').onclick=()=>show('settings');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));function show(tab){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelector('[data-tab="'+(tab==='sales'?'home':tab)+'"]')?.classList.add('active');q('home').style.display=tab==='home'||tab==='sales'?'block':'none';q('settings').classList.toggle('open',tab==='settings');if(tab==='sales'){q('home').innerHTML='<div class="section-title"><h2>Today’s orders</h2><small>'+s.z.length+' total</small></div><div class="form-card">'+(s.z.map(x=>'<div class="receipt-line"><span>'+x.i+' items<br><small>'+x.d+'</small></span><b>'+cash(x.t)+'</b></div>').join('')||'<div class="empty">No completed sales yet.</div>')+'</div>'}else if(!q('search'))location.reload()}
q('businessForm').onsubmit=e=>{e.preventDefault();s.b={name:q('businessName').value.trim()||'My Business',phone:q('businessPhone').value.trim(),address:q('businessAddress').value.trim()};save();draw()};q('productForm').onsubmit=e=>{e.preventDefault();s.p.push({id:Date.now(),n:q('name').value.trim(),v:+q('price').value,k:+q('stock').value,a:'📦',c:'art2'});save();e.target.reset();draw()};q('pay').onclick=()=>{if(!s.c.length)return;let t=s.c.reduce((a,x)=>a+x.v*x.q,0),i=s.c.reduce((a,x)=>a+x.q,0),d=new Date().toLocaleString(),r={t,i,d,lines:s.c.map(x=>({...x}))};s.c.forEach(x=>s.p.find(p=>p.id===x.id).k-=x.q);s.z.unshift({t,i,d});s.c=[];save();receipt(r);draw();q('sheet').classList.remove('open');window.print()};q('today').textContent=new Date().toLocaleDateString(undefined,{day:'numeric',month:'short'});q('businessName').value=s.b.name||'';q('businessPhone').value=s.b.phone||'';q('businessAddress').value=s.b.address||'';draw();
</script></body></html>
